<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGreen Dashboard</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        /*
         * ============================================================
         *  CHẾ ĐỘ "FILL" – LẤP KÍN MÀN HÌNH, KHÔNG MẤT NỘI DUNG
         * ============================================================
         *
         *  VẤN ĐỀ:
         *   - Report Power BI = 16:9, màn F11 thường = 16:10.
         *   - Nếu fit theo bề rộng (giữ đủ sidebar trái + cột phải)
         *     -> chiều cao report < chiều cao màn -> DƯ TRẮNG Ở ĐÁY.
         *
         *  CÁCH XỬ LÝ (chế độ 'fill'):
         *   - iframe được set đúng bề rộng report (16:9) nên Power BI
         *     lấp đầy bề rộng, KHÔNG tự thêm viền trắng 2 bên.
         *   - Sau đó JS kéo GIÃN NHẸ theo CHIỀU DỌC (scaleY) để phần
         *     report cao đúng bằng màn hình -> HẾT TRẮNG Ở ĐÁY,
         *     vẫn giữ ĐỦ trái/phải/trên/dưới (không cắt mất gì).
         *   - Thanh footer/tab Power BI nằm ở phần dư bên dưới và bị
         *     container (overflow:hidden) cắt bỏ -> không hiển thị.
         *
         *   * Trên màn 16:10, mức giãn dọc ~11% (rất nhẹ).
         *   * Trên TV 86" (16:9 THẬT) -> scaleY = 1.0, KHÔNG giãn,
         *     KHÔNG trắng, fit khít hoàn hảo.
         *
         * ------------------------------------------------------------
         *  BIẾN CÓ THỂ TINH CHỈNH:
         *
         *  --fill-mode  (đặt trong thẻ <body class="...">):
         *     "fill"    -> lấp kín màn hình (mặc định).
         *     "contain" -> fit trọn, KHÔNG giãn (chấp nhận trắng đáy).
         *
         *  --report-w / --report-h: tỉ lệ canvas report (mặc định 16:9).
         *  --pbi-footer: chiều cao thanh footer/tab Power BI cần cắt bỏ.
         *     - Vẫn thấy tab/thanh trắng ở đáy report -> TĂNG.
         *     - Mất chút nội dung ở đáy report -> GIẢM.
         * ============================================================
         */
        :root {
            --report-w: 16;
            --report-h: 9;
            --pbi-footer: 48px;
        }

        #report-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;         /* Cắt phần giãn dư + footer. */
            background: #ffffff;
        }

        #powerbi-frame {
            position: absolute;
            top: 0;
            left: 0;

            /* Kích thước & transform do JS tính và gán. */
            border: 0;
            margin: 0;
            padding: 0;
            display: block;
            background: #ffffff;

            transform-origin: top left;
        }

        /* Nút fullscreen góc dưới bên phải. */
        #fullscreen-btn {
            position: fixed !important;
            top: auto !important;
            right: 12px !important;
            bottom: 12px !important;
            left: auto !important;

            z-index: 2147483647;

            width: 42px;
            height: 42px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.70);
            color: #ffffff;

            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #fullscreen-btn:hover,
        #fullscreen-btn:focus {
            background: rgba(0, 0, 0, 0.90);
            outline: none;
        }

        #fullscreen-btn:active { transform: scale(0.94); }

        #fullscreen-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* Fullscreen mode. */
        #report-container:fullscreen,
        #report-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        /*
         * ------------------------------------------------------------
         *  TINH CHỈNH FOOTER THEO KÍCH THƯỚC MÀN HÌNH
         *  (ở 4K của TV 86", footer trông to hơn theo CSS px)
         * ------------------------------------------------------------
         */
        @media (max-height: 800px) {
            :root { --pbi-footer: 42px; }
        }
        @media (min-height: 900px) {
            :root { --pbi-footer: 52px; }
        }
        @media (min-height: 1400px) {
            :root { --pbi-footer: 64px; }
        }
    </style>
</head>

<!--
    class="fill"    -> lấp kín màn hình (khuyên dùng cho TV).
    class="contain" -> fit trọn không giãn (chấp nhận dải trắng đáy).
-->
<body class="fill">
    <div id="report-container">

        <iframe
            id="powerbi-frame"
            src="https://app.powerbi.com/view?r=eyJrIjoiMmYwYTYxYWItMzU5Mi00ZDk4LWJiMTMtODQyNjk0MzU4NmJjIiwidCI6IjJjYzNmNTVlLWUwNmUtNDRiYi1iMzQxLWI3MThlMDEyZTQ4ZiIsImMiOjEwfQ%3D%3D"
            title="GoGreen Dashboard"
            allowfullscreen
            webkitallowfullscreen
        ></iframe>

        <!-- Nút fullscreen góc dưới bên phải -->
        <button
            id="fullscreen-btn"
            type="button"
            title="Mở toàn màn hình"
            aria-label="Mở toàn màn hình"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5"></path>
                <path d="M16 3h5v5"></path>
                <path d="M8 21H3v-5"></path>
                <path d="M16 21h5v-5"></path>
            </svg>
        </button>

    </div>

    <script>
        const reportContainer = document.getElementById("report-container");
        const fullscreenButton = document.getElementById("fullscreen-btn");
        const frame = document.getElementById("powerbi-frame");

        /*
         * ------------------------------------------------------------
         *  TÍNH TOÁN KÍCH THƯỚC ĐỂ LẤP KÍN MÀN HÌNH
         * ------------------------------------------------------------
         */
        function applyFit() {
            const styles = getComputedStyle(document.documentElement);

            const rw = parseFloat(styles.getPropertyValue("--report-w")) || 16;
            const rh = parseFloat(styles.getPropertyValue("--report-h")) || 9;
            const footer =
                parseFloat(styles.getPropertyValue("--pbi-footer")) || 48;

            const W = window.innerWidth;
            const H = window.innerHeight;

            const mode = document.body.classList.contains("contain")
                ? "contain"
                : "fill";

            // Bề rộng report = full màn hình -> Power BI lấp kín bề ngang,
            // không tự thêm viền trắng 2 bên.
            const frameW = W;

            // Chiều cao tự nhiên của phần REPORT khi fit theo bề rộng.
            const reportH = frameW * rh / rw;

            // iframe = report + footer (footer sẽ bị cắt ở dưới).
            frame.style.width = frameW + "px";
            frame.style.height = (reportH + footer) + "px";

            if (mode === "fill") {
                // Kéo giãn dọc để phần report cao đúng bằng màn hình.
                // Trên 16:9 thật -> scaleY = 1 (không giãn).
                const scaleY = H / reportH;
                frame.style.transform = "scaleY(" + scaleY + ")";
            } else {
                // contain: không giãn, chấp nhận dải trắng ở đáy.
                frame.style.transform = "scaleY(1)";
            }
        }

        /*
         * ------------------------------------------------------------
         *  FULLSCREEN
         * ------------------------------------------------------------
         */
        function isFullscreen() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            );
        }

        function showEnterFullscreenIcon() {
            fullscreenButton.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M16 21h5v-5"></path>
                </svg>
            `;
            fullscreenButton.title = "Mở toàn màn hình";
            fullscreenButton.setAttribute("aria-label", "Mở toàn màn hình");
        }

        function showExitFullscreenIcon() {
            fullscreenButton.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 8h5V3"></path>
                    <path d="M21 8h-5V3"></path>
                    <path d="M3 16h5v5"></path>
                    <path d="M21 16h-5v5"></path>
                </svg>
            `;
            fullscreenButton.title = "Thoát toàn màn hình";
            fullscreenButton.setAttribute("aria-label", "Thoát toàn màn hình");
        }

        function updateFullscreenButton() {
            if (isFullscreen()) {
                showExitFullscreenIcon();
            } else {
                showEnterFullscreenIcon();
            }
            // Kích thước viewport đổi sau khi vào/ra fullscreen -> tính lại.
            applyFit();
        }

        function enterFullscreen() {
            if (reportContainer.requestFullscreen) {
                const result = reportContainer.requestFullscreen();
                if (result && result.catch) {
                    result.catch(function (error) {
                        console.error("Không thể mở fullscreen:", error);
                    });
                }
                return;
            }
            if (reportContainer.webkitRequestFullscreen) {
                reportContainer.webkitRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                const result = document.exitFullscreen();
                if (result && result.catch) {
                    result.catch(function (error) {
                        console.error("Không thể thoát fullscreen:", error);
                    });
                }
                return;
            }
            if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        fullscreenButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            if (isFullscreen()) {
                exitFullscreen();
            } else {
                enterFullscreen();
            }
        });

        document.addEventListener("fullscreenchange", updateFullscreenButton);
        document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

        // Tính lại khi cửa sổ đổi kích thước (F11, resize, xoay màn...).
        window.addEventListener("resize", applyFit);

        // Chạy lần đầu.
        applyFit();
        // Chạy lại sau khi layout ổn định.
        window.addEventListener("load", applyFit);
        setTimeout(applyFit, 300);

        updateFullscreenButton();
    </script>
</body>
</html>
