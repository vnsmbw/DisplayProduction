<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GoGreen Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        /*
         * ============================================================
         *  CẤU HÌNH TINH CHỈNH DASHBOARD (top-anchored)
         * ============================================================
         *
         * --dashboard-top-gap:
         *   Khoảng cách CỐ ĐỊNH từ mép trên màn hình xuống dashboard.
         *   Bạn muốn 5px -> để 5px. Nhờ transform-origin: top center,
         *   giá trị này KHÔNG bị đổi khi scale, nên top không bao giờ dính mép.
         *
         * --dashboard-scale:
         *   Phóng to dashboard để lấp phần viền trắng và "dàn trải" nội dung.
         *   Tăng nếu vẫn còn trắng, giảm nếu bị crop mất nội dung.
         *
         * --dashboard-offset-x:
         *   Dịch ngang dashboard để căn giữa cho cân đối (mặc định 0).
         *
         * --dashboard-crop-bottom:
         *   Tăng chiều cao iframe để đẩy phần trắng phía DƯỚI ra khỏi màn hình.
         *   Tăng giá trị này nếu bottom vẫn còn nhiều khoảng trắng.
         * ============================================================
         */
        :root {
            --dashboard-top-gap: 5px;
            --dashboard-scale: 1.02;
            --dashboard-offset-x: 0px;
            --dashboard-crop-bottom: 140px;
        }

        #report-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        #powerbi-frame {
            position: absolute;

            /*
             * NEO IFRAME TỪ ĐỈNH:
             * - top = khoảng cách cố định 5px (không đổi khi scale).
             * - transform-origin: top center -> scale nở XUỐNG DƯỚI,
             *   nên mép trên luôn giữ nguyên cách 5px.
             */
            top: var(--dashboard-top-gap);
            left: calc(50% + var(--dashboard-offset-x));

            width: 100vw;

            /*
             * Chiều cao = phần còn lại của màn hình (sau khi trừ top-gap)
             * CỘNG thêm phần crop-bottom để đẩy khoảng trắng dư ra ngoài.
             */
            height: calc(
                100vh
                - var(--dashboard-top-gap)
                + var(--dashboard-crop-bottom)
            );

            border: 0;
            margin: 0;
            padding: 0;

            transform: translateX(-50%) scale(var(--dashboard-scale));
            transform-origin: top center;

            display: block;
            background: #ffffff;
        }

        /*
         * Nút fullscreen ở góc dưới bên phải.
         */
        #fullscreen-btn {
            position: fixed !important;

            top: auto !important;
            right: 12px !important;
            bottom: 12px !important;
            left: auto !important;

            z-index: 2147483647;

            width: 42px;
            height: 42px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.70);
            color: #ffffff;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #fullscreen-btn:hover,
        #fullscreen-btn:focus {
            background: rgba(0, 0, 0, 0.90);
            outline: none;
        }

        #fullscreen-btn:active {
            transform: scale(0.94);
        }

        #fullscreen-btn svg {
            width: 22px;
            height: 22px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;

            pointer-events: none;
        }

        /*
         * Fullscreen mode.
         */
        #report-container:fullscreen {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        #report-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        /*
         * ------------------------------------------------------------
         *  ĐIỀU CHỈNH THEO KÍCH THƯỚC MÀN HÌNH
         *  (top-gap luôn = 5px, chỉ thay đổi scale & crop-bottom)
         * ------------------------------------------------------------
         */

        /* Màn hình thấp (<=800px): giảm scale & crop để tránh mất nội dung. */
        @media (max-height: 800px) {
            :root {
                --dashboard-scale: 1.015;
                --dashboard-crop-bottom: 110px;
            }
        }

        /* Màn hình cao (>=900px): crop bottom mạnh hơn. */
        @media (min-height: 900px) {
            :root {
                --dashboard-scale: 1.025;
                --dashboard-crop-bottom: 170px;
            }
        }

        /*
         * TV 86" thường là 4K (>=1400px chiều cao) -> crop bottom nhiều hơn nữa
         * để triệt tiêu khoảng trắng dư bên dưới.
         */
        @media (min-height: 1400px) {
            :root {
                --dashboard-scale: 1.03;
                --dashboard-crop-bottom: 260px;
            }
        }

        /* Màn hình rất rộng (>16:9): tăng scale nhẹ cho cân đối. */
        @media (min-aspect-ratio: 16/9) {
            :root {
                --dashboard-scale: 1.03;
                --dashboard-crop-bottom: 200px;
            }
        }
    </style>
</head>

<body>
    <div id="report-container">

        <iframe
            id="powerbi-frame"
            src="https://app.powerbi.com/view?r=eyJrIjoiMmYwYTYxYWItMzU5Mi00ZDk4LWJiMTMtODQyNjk0MzU4NmJjIiwidCI6IjJjYzNmNTVlLWUwNmUtNDRiYi1iMzQxLWI3MThlMDEyZTQ4ZiIsImMiOjEwfQ%3D%3D"
            title="GoGreen Dashboard"
            allowfullscreen
            webkitallowfullscreen
        ></iframe>

        <!-- Nút fullscreen góc dưới bên phải -->
        <button
            id="fullscreen-btn"
            type="button"
            title="Mở toàn màn hình"
            aria-label="Mở toàn màn hình"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5"></path>
                <path d="M16 3h5v5"></path>
                <path d="M8 21H3v-5"></path>
                <path d="M16 21h5v-5"></path>
            </svg>
        </button>

    </div>

    <script>
        const reportContainer =
            document.getElementById("report-container");

        const fullscreenButton =
            document.getElementById("fullscreen-btn");

        /*
         * Kiểm tra trạng thái fullscreen.
         * Hỗ trợ cả Fullscreen API chuẩn và WebKit.
         */
        function isFullscreen() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            );
        }

        /*
         * Hiển thị icon mở fullscreen.
         */
        function showEnterFullscreenIcon() {
            fullscreenButton.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M16 21h5v-5"></path>
                </svg>
            `;

            fullscreenButton.title = "Mở toàn màn hình";

            fullscreenButton.setAttribute(
                "aria-label",
                "Mở toàn màn hình"
            );
        }

        /*
         * Hiển thị icon thoát fullscreen.
         */
        function showExitFullscreenIcon() {
            fullscreenButton.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 8h5V3"></path>
                    <path d="M21 8h-5V3"></path>
                    <path d="M3 16h5v5"></path>
                    <path d="M21 16h-5v5"></path>
                </svg>
            `;

            fullscreenButton.title = "Thoát toàn màn hình";

            fullscreenButton.setAttribute(
                "aria-label",
                "Thoát toàn màn hình"
            );
        }

        /*
         * Cập nhật icon theo trạng thái fullscreen.
         */
        function updateFullscreenButton() {
            if (isFullscreen()) {
                showExitFullscreenIcon();
            } else {
                showEnterFullscreenIcon();
            }
        }

        /*
         * Mở fullscreen cho toàn bộ container.
         * Nút nằm trong container nên vẫn hiển thị
         * khi dashboard đang fullscreen.
         */
        function enterFullscreen() {
            if (reportContainer.requestFullscreen) {
                const result = reportContainer.requestFullscreen();

                if (result && result.catch) {
                    result.catch(function (error) {
                        console.error(
                            "Không thể mở fullscreen:",
                            error
                        );
                    });
                }

                return;
            }

            if (reportContainer.webkitRequestFullscreen) {
                reportContainer.webkitRequestFullscreen();
            }
        }

        /*
         * Thoát chế độ fullscreen.
         */
        function exitFullscreen() {
            if (document.exitFullscreen) {
                const result = document.exitFullscreen();

                if (result && result.catch) {
                    result.catch(function (error) {
                        console.error(
                            "Không thể thoát fullscreen:",
                            error
                        );
                    });
                }

                return;
            }

            if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        /*
         * Xử lý thao tác chạm hoặc click.
         */
        fullscreenButton.addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                event.stopPropagation();

                if (isFullscreen()) {
                    exitFullscreen();
                } else {
                    enterFullscreen();
                }
            }
        );

        /*
         * Đồng bộ icon khi trạng thái fullscreen thay đổi.
         */
        document.addEventListener(
            "fullscreenchange",
            updateFullscreenButton
        );

        document.addEventListener(
            "webkitfullscreenchange",
            updateFullscreenButton
        );

        updateFullscreenButton();
    </script>
</body>
</html>
