<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GoGreen Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        #report-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #ffffff;
        }

        #powerbi-frame {
            position: absolute;
            top: 50%;
            left: calc(50% - 20px);

            width: 100vw;
            height: 100vh;

            border: 0;
            margin: 0;
            padding: 0;

            /*
             * Phóng nhẹ để loại bỏ viền trắng hai bên.
             * Dashboard không bị méo, nhưng sẽ bị crop nhẹ
             * ở cạnh trên và cạnh dưới.
             */
            transform: translate(-50%, -50%) scale(1.04);
            transform-origin: center center;
        }

        /*
         * Nút fullscreen ở góc dưới bên phải.
         *
         * top: auto !important giúp vô hiệu hóa hoàn toàn
         * vị trí top cũ nếu trình duyệt vẫn đang cache CSS.
         */
        #fullscreen-btn {
            position: fixed !important;

            top: auto !important;
            right: 12px !important;
            bottom: 12px !important;
            left: auto !important;

            z-index: 2147483647;

            width: 42px;
            height: 42px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.70);
            color: #ffffff;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #fullscreen-btn:hover,
        #fullscreen-btn:focus {
            background: rgba(0, 0, 0, 0.90);
            outline: none;
        }

        #fullscreen-btn:active {
            transform: scale(0.94);
        }

        #fullscreen-btn svg {
            width: 22px;
            height: 22px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;

            pointer-events: none;
        }

        /*
         * Đảm bảo container phủ toàn bộ màn hình
         * khi chuyển sang chế độ fullscreen.
         */
        #report-container:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        #report-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="report-container">

        <iframe
            id="powerbi-frame"
            src="https://app.powerbi.com/view?r=eyJrIjoiMmYwYTYxYWItMzU5Mi00ZDk4LWJiMTMtODQyNjk0MzU4NmJjIiwidCI6IjJjYzNmNTVlLWUwNmUtNDRiYi1iMzQxLWI3MThlMDEyZTQ4ZiIsImMiOjEwfQ%3D%3D&amp;pageView=fitToPage"
            title="GoGreen Dashboard"
            allowfullscreen
        ></iframe>

        <!-- Nút fullscreen góc dưới bên phải -->
        <button
            id="fullscreen-btn"
            type="button"
            title="Mở toàn màn hình"
            aria-label="Mở toàn màn hình"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5"></path>
                <path d="M16 3h5v5"></path>
                <path d="M8 21H3v-5"></path>
                <path d="M16 21h5v-5"></path>
            </svg>
        </button>

    </div>

    <script>
        const reportContainer =
            document.getElementById("report-container");

        const fullscreenButton =
            document.getElementById("fullscreen-btn");

        /*
         * Kiểm tra trạng thái fullscreen.
         * Hỗ trợ cả Fullscreen API chuẩn và WebKit.
         */
        function isFullscreen() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            );
        }

        /*
         * Hiển thị icon mở fullscreen.
         */
        function showEnterFullscreenIcon() {
            fullscreenButton.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M16 21h5v-5"></path>
                </svg>
            `;

            fullscreenButton.title = "Mở toàn màn hình";

            fullscreenButton.setAttribute(
                "aria-label",
                "Mở toàn màn hình"
            );
        }

        /*
         * Hiển thị icon thoát fullscreen.
         */
        function showExitFullscreenIcon() {
            fullscreenButton.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 8h5V3"></path>
                    <path d="M21 8h-5V3"></path>
                    <path d="M3 16h5v5"></path>
                    <path d="M21 16h-5v5"></path>
                </svg>
            `;

            fullscreenButton.title = "Thoát toàn màn hình";

            fullscreenButton.setAttribute(
                "aria-label",
                "Thoát toàn màn hình"
            );
        }

        /*
         * Cập nhật icon theo trạng thái fullscreen.
         */
        function updateFullscreenButton() {
            if (isFullscreen()) {
                showExitFullscreenIcon();
            } else {
                showEnterFullscreenIcon();
            }
        }

        /*
         * Mở fullscreen cho toàn bộ container.
         * Nút nằm trong container nên vẫn hiển thị
         * khi dashboard đang fullscreen.
         */
        function enterFullscreen() {
            if (reportContainer.requestFullscreen) {
                const result = reportContainer.requestFullscreen();

                if (result && result.catch) {
                    result.catch(function (error) {
                        console.error(
                            "Không thể mở fullscreen:",
                            error
                        );
                    });
                }

                return;
            }

            if (reportContainer.webkitRequestFullscreen) {
                reportContainer.webkitRequestFullscreen();
            }
        }

        /*
         * Thoát chế độ fullscreen.
         */
        function exitFullscreen() {
            if (document.exitFullscreen) {
                const result = document.exitFullscreen();

                if (result && result.catch) {
                    result.catch(function (error) {
                        console.error(
                            "Không thể thoát fullscreen:",
                            error
                        );
                    });
                }

                return;
            }

            if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        /*
         * Xử lý thao tác chạm hoặc click.
         */
        fullscreenButton.addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                event.stopPropagation();

                if (isFullscreen()) {
                    exitFullscreen();
                } else {
                    enterFullscreen();
                }
            }
        );

        /*
         * Đồng bộ icon khi trạng thái fullscreen thay đổi.
         */
        document.addEventListener(
            "fullscreenchange",
            updateFullscreenButton
        );

        document.addEventListener(
            "webkitfullscreenchange",
            updateFullscreenButton
        );

        updateFullscreenButton();
    </script>
</body>
</html>
