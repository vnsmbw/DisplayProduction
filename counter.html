<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đồng hồ đếm ngược 60 phút</title><style>body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f3f6fa;margin:0} .box{text-align:center} .timer{font-size:120px;font-weight:bold;color:#d32f2f} button{font-size:24px;padding:12px 24px;margin:8px}</style></head><body><div class="box"><h1>CUỘC THI CẮM HOA</h1><div class="timer" id="timer">60:00</div><button onclick="startTimer()">Bắt đầu</button><button onclick="resetTimer()">Đặt lại</button></div><script>let total=3600;let remain=total;let interval=null;function show(){let m=Math.floor(remain/60);let s=remain%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}function startTimer(){if(interval)return;interval=setInterval(()=>{if(remain>60){remain--;show();}else{clearInterval(interval);interval=null;alert('Còn 1 phút!');show();}},1000);}function resetTimer(){clearInterval(interval);interval=null;remain=total;show();}show();</script></body></html>
