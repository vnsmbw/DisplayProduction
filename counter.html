<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuộc thi cắm hoa - Đếm ngược 60 phút</title><style>body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;font-family:Arial,sans-serif}.wrap{text-align:center}.title{font-size:48px;font-weight:bold;margin-bottom:20px}.timer{font-size:220px;font-weight:900}.note{font-size:30px;margin-top:10px}.green{color:#22c55e}.yellow{color:#facc15}.red{color:#ef4444}button{font-size:24px;padding:12px 24px;margin:8px;border:none;border-radius:10px;cursor:pointer}</style></head><body><div class="wrap"><div class="title">🌸 CUỘC THI CẮM HOA 🌸</div><div id="timer" class="timer green">60:00</div><div id="msg" class="note">Thời gian thực hiện: 60 phút</div><div><button onclick="startTimer()">Bắt đầu</button><button onclick="resetTimer()">Đặt lại</button></div></div><script>let total=3600,remain=3600,t=null;function beep(){let a=new(window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=800;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close();},500);}function draw(){let m=Math.floor(remain/60),s=remain%60;let el=document.getElementById('timer');el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.className='timer '+(remain<=300?'red':remain<=900?'yellow':'green');}function startTimer(){if(t)return;t=setInterval(()=>{remain--;if(remain===600||remain===300||remain===60){beep();document.getElementById('msg').innerHTML='⚠️ Còn '+Math.floor(remain/60)+' phút!';}draw();if(remain<=0){clearInterval(t);beep();beep();document.getElementById('msg').innerHTML='⏰ HẾT GIỜ!';}},1000);}function resetTimer(){clearInterval(t);t=null;remain=3600;document.getElementById('msg').innerHTML='Thời gian thực hiện: 60 phút';draw();}draw();</script></body></html>
